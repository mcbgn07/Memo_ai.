<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memo AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #292b31;
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      color: #888;
      margin-top: 5px;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai {
      background: #24262d;
      margin-right: auto;
    }

    .user {
      background: #315efb;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #292b31;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 24px;
      padding: 0 16px;
      background: #24262d;
      color: white;
      font-size: 16px;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #315efb;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Memo AI</h1>
      <p>Senin yapay zekâ asistanın</p>
    </header>

    <div id="chat">

      <div class="message ai">
        Merhaba! Ben Memo AI 🤖
        Bana bir soru sor.
      </div>

    </div>

    <div class="input-area">

      <input
        id="message"
        type="text"
        placeholder="Memo'ya bir şey sor..."
      >

      <button onclick="sendMessage()">➤</button>

    </div>

  </div>

  <script>
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function sendMessage() {

      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      setTimeout(() => {
        addMessage(
          "Şimdilik sadece arayüzüm hazır 🤖 Yapay zekâ bağlantım bir sonraki adımda eklenecek.",
          "ai"
        );
      }, 500);
    }

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
